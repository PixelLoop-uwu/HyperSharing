version: "2"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "internal/user/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/user/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "internal/storage/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/storage/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "internal/post/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/post/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
